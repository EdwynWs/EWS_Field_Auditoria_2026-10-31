name: Commercial readiness
on:
  pull_request:
  push:
    branches: [main, "security/**"]
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ews_field_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/ews_field_test
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_PUBLIC_API_URL: https://api.example.invalid
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/scan-secrets.mjs
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:web
      - run: npx expo-doctor mobile
      - run: npm exec --workspace=mobile -- expo install --check
      - run: npm exec --workspace=mobile -- expo export --platform android
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Prove backup and restore on disposable databases
        run: node scripts/test-restore.mjs
