services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ews_field
      POSTGRES_USER: ews_field
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ews_field -d ews_field']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
